    <script>
      try {
        var theme = localStorage.getItem('relay.theme') || localStorage.getItem('mech.theme');
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
        var lang = localStorage.getItem('relay.language') || localStorage.getItem('mech.language');

          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        }
      } catch (error) {
        /* storage can be unavailable */
      }
    </script>
