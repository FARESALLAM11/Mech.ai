<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relay &mdash; Agent workspace</title>
    <link rel="icon" type="image/svg+xml" href="/src/relay-mark.svg" />
    <script>
      try {
        var theme = localStorage.getItem('relay.theme') || localStorage.getItem('mech.theme');
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
        var lang = localStorage.getItem('relay.language') || localStorage.getItem('mech.language');
        if (lang === 'ar') {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        }
      } catch (error) {
        /* storage can be unavailable */
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
