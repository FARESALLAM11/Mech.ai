<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="hero">
        <h1>Welcome to Our Tree Website</h1>
    </header>
    <main class="tree-cards">
        <div class="tree-card" data-type="oak">
            <h2>Oak Tree</h2>
            <p>Long-lived and strong.</p>
        </div>
        <div class="tree-card" data-type="pine">
            <h2>Pine Tree</h2>
            <p>Evergreen and adaptable.</p>
        </div>
        <div class="tree-card" data-type="maple">
            <h2>Maple Tree</h2>
            <p>Deciduous and colorful.</p>
        </div>
    </main>
    <button id="leaf-counter">Count Leaves (0)</button>
    <script src="script.js"></script>
</body>
</html>
